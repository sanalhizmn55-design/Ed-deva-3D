<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, orientation=landscape">
    <title>Dörtyol Grand Sim</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Arial', sans-serif; }
        #ui { position: absolute; top: 20px; right: 20px; color: #00ff00; background: rgba(0,0,0,0.8); padding: 15px; border-radius: 10px; border: 1px solid #00ff00; font-family: monospace; z-index: 10; }
        #controls { position: absolute; bottom: 20px; width: 100%; display: flex; justify-content: space-between; padding: 0 40px; box-sizing: border-box; z-index: 10; }
        .btn { width: 80px; height: 80px; background: rgba(255,255,255,0.1); border: 2px solid #fff; border-radius: 50%; color: #fff; font-weight: bold; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
        #btnAction { background: #00ff00; color: #000; width: 90px; height: 90px; border: none; font-size: 18px; visibility: hidden; }
        .side { display: flex; gap: 20px; }
        #crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; font-size: 24px; pointer-events: none; }
    </style>
</head>
<body>
    <div id="ui">SYSTEM_READY<br>SKOR: <span id="scoreVal">0</span></div>
    <div id="crosshair">+</div>
    
    <div id="controls">
        <div class="side">
            <div class="btn" id="btnLeft">SOL</div>
            <div class="btn" id="btnRight">SAĞ</div>
        </div>
        <div class="side">
            <div class="btn" id="btnAction">BIN</div>
            <div class="btn" id="btnGas">GAZ</div>
            <div class="btn" id="btnBrake">FREN</div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xadd8e6);
        scene.fog = new THREE.Fog(0xadd8e6, 10, 100);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // --- IŞIK (SİNEMATİK) ---
        const ambient = new THREE.AmbientLight(0xffffff, 0.5); scene.add(ambient);
        const sun = new THREE.DirectionalLight(0xffffff, 1.2);
        sun.position.set(50, 50, 50); sun.castShadow = true;
        scene.add(sun);

        // --- ŞEHİR ZEMİNİ ---
        const ground = new THREE.Mesh(new THREE.PlaneGeometry(1000, 1000), new THREE.MeshStandardMaterial({ color: 0x222222 }));
        ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);

        // Basit Binalar (Harita boş görünmesin)
        for(let i=0; i<40; i++){
            const h = Math.random()*20 + 5;
            const b = new THREE.Mesh(new THREE.BoxGeometry(5, h, 5), new THREE.MeshStandardMaterial({color: 0x444466}));
            b.position.set(Math.random()*200-100, h/2, Math.random()*200-100);
            if(b.position.length() > 20) scene.add(b);
        }

        // --- LÜKS ARABA TASARIMI (MODELLEME) ---
        const car = new THREE.Group();
        const bodyMat = new THREE.MeshStandardMaterial({color: 0x0a0a0a, metalness: 1, roughness: 0.1});
        const carBody = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.5, 4.5), bodyMat);
        carBody.position.y = 0.6; carBody.castShadow = true; car.add(carBody);
        
        const carCabin = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.5, 2.2), new THREE.MeshStandardMaterial({color: 0x000000, opacity: 0.7, transparent: true}));
        carCabin.position.set(0, 1.1, -0.3); car.add(carCabin);

        const grill = new THREE.Mesh(new THREE.PlaneGeometry(1.2, 0.3), new THREE.MeshStandardMaterial({color: 0xcccccc}));
        grill.position.set(0, 0.6, 2.26); car.add(grill);

        car.position.set(0, 0, -10); scene.add(car);

        // --- KARAKTER (MODERN FPS/TPS) ---
        const player = new THREE.Group();
        const pBody = new THREE.Mesh(new THREE.CapsuleGeometry(0.4, 1.2, 4, 8), new THREE.MeshStandardMaterial({color: 0x2222ff}));
        player.add(pBody); player.position.y = 1; scene.add(player);

        // --- GERÇEKÇİ İNSANLAR (NPC) ---
        const npcs = [];
        const createHuman = () => {
            const h = new THREE.Group();
            const torso = new THREE.Mesh(new THREE.BoxGeometry(0.6, 1, 0.3), new THREE.MeshStandardMaterial({color: 0xff3333}));
            const head = new THREE.Mesh(new THREE.SphereGeometry(0.25), new THREE.MeshStandardMaterial({color: 0xffdbac}));
            head.position.y = 0.7; 
            const l1 = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.8, 0.2), new THREE.MeshStandardMaterial({color: 0x333333}));
            l1.position.set(0.15, -0.7, 0);
            const l2 = l1.clone(); l2.position.x = -0.15;
            h.add(torso, head, l1, l2);
            h.position.set(Math.random()*80-40, 0.8, Math.random()*80-40);
            scene.add(h); npcs.push(h);
        }
        for(let i=0; i<15; i++) createHuman();

        // --- KONTROL MANTIĞI ---
        let isDriving = false, score = 0, velocity = 0, angle = 0;
        const keys = {f:0, b:0, l:0, r:0};
        const setup = (id, k) => {
            const el = document.getElementById(id);
            el.ontouchstart = (e) => { e.preventDefault(); keys[k]=1; };
            el.ontouchend = (e) => { e.preventDefault(); keys[k]=0; };
        };
        setup('btnGas', 'f'); setup('btnBrake', 'b'); setup('btnLeft', 'l'); setup('btnRight', 'r');

        const btnBin = document.getElementById('btnAction');
        btnBin.onclick = () => {
            isDriving = !isDriving;
            btnBin.innerText = isDriving ? "IN" : "BIN";
            if(!isDriving) player.position.copy(car.position).add(new THREE.Vector3(3, 1, 0));
        };

        function animate() {
            requestAnimationFrame(animate);
            const d = player.position.distanceTo(car.position);
            btnBin.style.visibility = (d < 5 || isDriving) ? 'visible' : 'hidden';

            if(isDriving) {
                if(keys.f) velocity += 0.02; else if(keys.b) velocity -= 0.02; else velocity *= 0.96;
                if(Math.abs(velocity) > 0.1) { if(keys.l) angle += 0.035; if(keys.r) angle -= 0.035; }
                car.rotation.y = angle;
                car.position.x += Math.sin(angle) * velocity;
                car.position.z += Math.cos(angle) * velocity;
                player.position.copy(car.position);

                npcs.forEach(n => {
                    if(car.position.distanceTo(n.position) < 2.5) {
                        n.position.set(Math.random()*100-50, 0.8, Math.random()*100-50);
                        score += 100; document.getElementById('scoreVal').innerText = score;
                    }
                });

                const cOff = new THREE.Vector3(0, 5, -12).applyQuaternion(car.quaternion);
                camera.position.lerp(car.position.clone().add(cOff), 0.1);
                camera.lookAt(car.position);
            } else {
                if(keys.f) player.translateZ(-0.2); if(keys.b) player.translateZ(0.2);
                if(keys.l) player.rotation.y += 0.05; if(keys.r) player.rotation.y -= 0.05;
                const pOff = new THREE.Vector3(0, 4, 8).applyQuaternion(player.quaternion);
                camera.position.lerp(player.position.clone().add(pOff), 0.1);
                camera.lookAt(player.position);
            }
            renderer.render(scene, camera);
        }
        animate();
        window.onresize = () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); };
    </script>
</body>
</html>
