<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dörtyol Real Drive FIX</title>
    <style>
        body { margin: 0; overflow: hidden; background: #87CEEB; font-family: sans-serif; }
        canvas { display: block; }
        #ui { position: absolute; top: 10px; right: 10px; color: #fff; background: rgba(0,0,0,0.8); padding: 10px; border-radius: 10px; font-weight: bold; }
        #controls { position: absolute; bottom: 20px; width: 100%; display: flex; justify-content: space-between; padding: 0 30px; box-sizing: border-box; }
        .btn { width: 70px; height: 70px; background: rgba(0,0,0,0.5); border: 2px solid #fff; border-radius: 50%; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; }
        #btnAction { background: #FFD700; color: #000; width: 80px; height: 80px; visibility: hidden; }
        .side { display: flex; gap: 15px; }
    </style>
</head>
<body>
    <div id="ui">SKOR: <span id="scoreVal">0</span></div>
    <div id="controls">
        <div class="side">
            <div class="btn" id="btnLeft">SOL</div>
            <div class="btn" id="btnRight">SAĞ</div>
        </div>
        <div class="side">
            <div class="btn" id="btnAction">BİN</div>
            <div class="btn" id="btnGas">GAZ</div>
            <div class="btn" id="btnBrake">FREN</div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB); // Masmavi gökyüzü kesinleşti
        
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: false }); // Performans için kapattım
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Işık (Basic material kullanacağımız için sadece yedek)
        const light = new THREE.DirectionalLight(0xffffff, 1);
        light.position.set(0, 20, 10);
        scene.add(light);

        // Zemin
        const ground = new THREE.Mesh(new THREE.PlaneGeometry(1000, 1000), new THREE.MeshBasicMaterial({ color: 0x555555 }));
        ground.rotation.x = -Math.PI / 2;
        scene.add(ground);

        // MERCEDES (Parlak Siyah)
        const car = new THREE.Group();
        const body = new THREE.Mesh(new THREE.BoxGeometry(2, 0.7, 4), new THREE.MeshBasicMaterial({color: 0x111111}));
        body.position.y = 0.5; car.add(body);
        const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.5, 2), new THREE.MeshBasicMaterial({color: 0x333333}));
        cabin.position.set(0, 1, -0.2); car.add(cabin);
        car.position.set(0, 0, -10);
        scene.add(car);

        // OYUNCU (Mavi Karakter)
        const player = new THREE.Group();
        const pBody = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 1.5), new THREE.MeshBasicMaterial({color: 0x0000ff}));
        player.add(pBody);
        player.position.set(0, 0.75, 0);
        scene.add(player);

        // İNSANLAR (NPC)
        const npcs = [];
        for(let i=0; i<15; i++) {
            const h = new THREE.Group();
            const b = new THREE.Mesh(new THREE.BoxGeometry(0.5, 1, 0.2), new THREE.MeshBasicMaterial({color: 0xff0000}));
            const head = new THREE.Mesh(new THREE.SphereGeometry(0.2), new THREE.MeshBasicMaterial({color: 0xffdbac}));
            head.position.y = 0.7; h.add(b, head);
            h.position.set(Math.random()*40-20, 0.5, Math.random()*40-20);
            scene.add(h); npcs.push(h);
        }

        let isDriving = false, score = 0, speed = 0, angle = 0;
        const keys = {f:0, b:0, l:0, r:0};

        const setup = (id, k) => {
            const el = document.getElementById(id);
            el.ontouchstart = (e) => { e.preventDefault(); keys[k]=1; };
            el.ontouchend = (e) => { e.preventDefault(); keys[k]=0; };
        };
        setup('btnGas', 'f'); setup('btnBrake', 'b'); setup('btnLeft', 'l'); setup('btnRight', 'r');

        const actionBtn = document.getElementById('btnAction');
        actionBtn.onclick = () => {
            isDriving = !isDriving;
            actionBtn.innerText = isDriving ? "İN" : "BİN";
            if(!isDriving) player.position.copy(car.position).add(new THREE.Vector3(2, 0.75, 0));
        };

        function animate() {
            requestAnimationFrame(animate);
            const dist = player.position.distanceTo(car.position);
            actionBtn.style.visibility = (dist < 4 || isDriving) ? 'visible' : 'hidden';

            if(isDriving) {
                if(keys.f) speed += 0.02; else if(keys.b) speed -= 0.02; else speed *= 0.95;
                if(Math.abs(speed) > 0.05) { if(keys.l) angle += 0.04; if(keys.r) angle -= 0.04; }
                car.rotation.y = angle;
                car.position.x += Math.sin(angle) * speed;
                car.position.z += Math.cos(angle) * speed;
                player.position.copy(car.position);
                
                // Çarpma
                npcs.forEach(n => {
                    if(car.position.distanceTo(n.position) < 2) {
                        n.position.set(Math.random()*60-30, 0.5, Math.random()*60-30);
                        score += 10; document.getElementById('scoreVal').innerText = score;
                    }
                });

                camera.position.copy(car.position).add(new THREE.Vector3(0, 4, -8).applyQuaternion(car.quaternion));
                camera.lookAt(car.position);
            } else {
                if(keys.f) player.translateZ(-0.15); if(keys.b) player.translateZ(0.15);
                if(keys.l) player.rotation.y += 0.05; if(keys.r) player.rotation.y -= 0.05;
                camera.position.copy(player.position).add(new THREE.Vector3(0, 3, 6).applyQuaternion(player.quaternion));
                camera.lookAt(player.position);
            }
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
