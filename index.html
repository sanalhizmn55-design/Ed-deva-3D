<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dörtyol Real Drive</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Arial Black', sans-serif; }
        canvas { display: block; }
        #ui { position: absolute; top: 10px; right: 10px; color: gold; background: rgba(0,0,0,0.7); padding: 10px; border-radius: 10px; font-size: 18px; border: 1px solid gold; pointer-events: none; }
        #controls { position: absolute; bottom: 20px; width: 100%; display: flex; justify-content: space-between; padding: 0 40px; box-sizing: border-box; }
        .btn { width: 70px; height: 70px; background: rgba(255,255,255,0.2); border: 2px solid #fff; border-radius: 50%; color: #fff; font-size: 12px; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
        #btnAction { background: gold; color: black; font-weight: bold; width: 80px; height: 80px; border: none; visibility: hidden; }
        .side { display: flex; gap: 20px; }
        #msg { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; background: rgba(0,0,0,0.8); padding: 10px; border-radius: 5px; display: none; }
    </style>
</head>
<body>
    <div id="ui">SKOR: <span id="scoreVal">0</span></div>
    <div id="msg">Araca yaklaş ve BIN butonuna bas!</div>
    
    <div id="controls">
        <div class="side">
            <div class="btn" id="btnLeft">SOL</div>
            <div class="btn" id="btnRight">SAĞ</div>
        </div>
        <div class="side">
            <div class="btn" id="btnAction">BIN</div>
            <div class="btn" id="btnGas">GAZ / İLERİ</div>
            <div class="btn" id="btnBrake">FREN / GERİ</div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const light = new THREE.AmbientLight(0xffffff, 0.8); scene.add(light);
        const sun = new THREE.DirectionalLight(0xffffff, 1); sun.position.set(10, 50, 10); scene.add(sun);

        const ground = new THREE.Mesh(new THREE.PlaneGeometry(1000, 1000), new THREE.MeshStandardMaterial({ color: 0x444444 }));
        ground.rotation.x = -Math.PI / 2; scene.add(ground);

        // --- MERCEDES ---
        const car = new THREE.Group();
        const body = new THREE.Mesh(new THREE.BoxGeometry(2, 0.7, 4.5), new THREE.MeshStandardMaterial({color: 0x050505, metalness: 1}));
        body.position.y = 0.5; car.add(body);
        const glass = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.5, 2), new THREE.MeshStandardMaterial({color: 0x222222}));
        glass.position.set(0, 1, -0.2); car.add(glass);
        car.position.set(0, 0, -10); scene.add(car);

        // --- KARAKTER (OYUNCU) ---
        const player = new THREE.Group();
        const playerBody = new THREE.Mesh(new THREE.CapsuleGeometry(0.3, 1, 4, 8), new THREE.MeshStandardMaterial({color: 0x0000ff}));
        player.add(playerBody);
        player.position.set(0, 1, 0);
        scene.add(player);

        // --- İNSANLAR (NPC) ---
        const nps = [];
        function spawnHuman() {
            const human = new THREE.Group();
            const body = new THREE.Mesh(new THREE.BoxGeometry(0.5, 1, 0.3), new THREE.MeshStandardMaterial({color: Math.random() * 0xffffff}));
            const head = new THREE.Mesh(new THREE.SphereGeometry(0.2), new THREE.MeshStandardMaterial({color: 0xffdbac}));
            head.position.y = 0.7; human.add(body, head);
            human.position.set(Math.random()*60-30, 0.8, Math.random()*60-30);
            scene.add(human); nps.push(human);
        }
        for(let i=0; i<20; i++) spawnHuman();

        // --- DURUM VE KONTROLLER ---
        let isDriving = false;
        let score = 0;
        let velocity = 0, angle = 0;
        const keys = {f:0, b:0, l:0, r:0};

        const setup = (id, k) => {
            const el = document.getElementById(id);
            el.ontouchstart = (e) => { e.preventDefault(); keys[k]=1; };
            el.ontouchend = (e) => { e.preventDefault(); keys[k]=0; };
        };
        setup('btnGas', 'f'); setup('btnBrake', 'b'); setup('btnLeft', 'l'); setup('btnRight', 'r');

        const btnAction = document.getElementById('btnAction');
        btnAction.onclick = () => {
            isDriving = !isDriving;
            btnAction.innerText = isDriving ? "IN" : "BIN";
            if(!isDriving) { 
                player.position.copy(car.position).add(new THREE.Vector3(3, 1, 0));
            }
        };

        function animate() {
            requestAnimationFrame(animate);

            const distToCar = player.position.distanceTo(car.position);
            btnAction.style.visibility = (distToCar < 5 || isDriving) ? 'visible' : 'hidden';

            if(isDriving) {
                // Sürüş Modu
                player.position.copy(car.position);
                if(keys.f) velocity += 0.02; else if(keys.b) velocity -= 0.02; else velocity *= 0.95;
                if(Math.abs(velocity) > 0.1) { if(keys.l) angle += 0.03; if(keys.r) angle -= 0.03; }
                car.rotation.y = angle;
                car.position.x += Math.sin(angle) * velocity;
                car.position.z += Math.cos(angle) * velocity;

                // NPC Çarpışma
                nps.forEach(n => {
                    if(car.position.distanceTo(n.position) < 2) {
                        n.position.set(Math.random()*100-50, 0.8, Math.random()*100-50);
                        score += 50; document.getElementById('scoreVal').innerText = score;
                    }
                });

                const camOffset = new THREE.Vector3(0, 4, -10).applyQuaternion(car.quaternion);
                camera.position.lerp(car.position.clone().add(camOffset), 0.1);
                camera.lookAt(car.position);
            } else {
                // Yürüme Modu
                let pDir = new THREE.Vector3(0,0,0);
                if(keys.f) pDir.z -= 0.15; if(keys.b) pDir.z += 0.15;
                if(keys.l) player.rotation.y += 0.05; if(keys.r) player.rotation.y -= 0.05;
                player.translateZ(pDir.z);

                const pOffset = new THREE.Vector3(0, 3, 5).applyQuaternion(player.quaternion);
                camera.position.lerp(player.position.clone().add(pOffset), 0.1);
                camera.lookAt(player.position);
            }

            renderer.render(scene, camera);
        }
        animate();
        window.onresize = () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); };
    </script>
</body>
</html>
