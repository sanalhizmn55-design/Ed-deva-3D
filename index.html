<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mercedes Luxury Drive: Dörtyol</title>
    <style>
        body { margin: 0; overflow: hidden; background: #87CEEB; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; touch-action: none; }
        canvas { display: block; }
        #ui { position: absolute; top: 15px; left: 50%; transform: translateX(-50%); text-align: center; z-index: 100; }
        #scoreContainer { font-size: 24px; color: gold; font-weight: bold; background: rgba(0,0,0,0.8); padding: 10px 30px; border-radius: 50px; border: 2px solid gold; box-shadow: 0 0 15px gold; }
        #controls { position: absolute; bottom: 30px; width: 100%; display: flex; justify-content: space-between; padding: 0 25px; box-sizing: border-box; z-index: 100; }
        .btn { width: 80px; height: 80px; background: rgba(255,255,255,0.2); border: 3px solid white; border-radius: 50%; color: white; font-weight: bold; font-size: 16px; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
        .btn-gas { background: rgba(0, 255, 0, 0.4); border-color: #0f0; width: 90px; height: 90px; }
        .btn-brake { background: rgba(255, 0, 0, 0.4); border-color: #f00; width: 70px; height: 70px; }
        .side { display: flex; gap: 20px; align-items: center; }
    </style>
</head>
<body>
    <div id="ui">
        <div id="scoreContainer">SKOR: <span id="scoreVal">0</span></div>
    </div>
    
    <div id="controls">
        <div class="side">
            <div class="btn" id="btnLeft">←</div>
            <div class="btn" id="btnRight">→</div>
        </div>
        <div class="side">
            <div class="btn btn-gas" id="btnGas">GAZ</div>
            <div class="btn btn-brake" id="btnBrake">FREN</div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);

        const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // --- IŞIKLANDIRMA ---
        const ambient = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambient);
        const sun = new THREE.DirectionalLight(0xffffff, 1.2);
        sun.position.set(10, 20, 10);
        sun.castShadow = true;
        scene.add(sun);

        // --- ZEMİN VE YOLLAR ---
        const ground = new THREE.Mesh(new THREE.PlaneGeometry(1000, 1000), new THREE.MeshStandardMaterial({ color: 0x333333 }));
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // Yol çizgileri
        for(let i = -500; i < 500; i += 20) {
            const line = new THREE.Mesh(new THREE.PlaneGeometry(0.5, 10), new THREE.MeshBasicMaterial({color: 0xffffff}));
            line.rotation.x = -Math.PI / 2;
            line.position.set(0, 0.01, i);
            scene.add(line);
        }

        // --- MERCEDES S-CLASS DETAYLI TASARIM ---
        const mercedes = new THREE.Group();
        const paint = new THREE.MeshStandardMaterial({ color: 0x0a0a0a, metalness: 1, roughness: 0.1 });
        const glass = new THREE.MeshStandardMaterial({ color: 0x111111, opacity: 0.8, transparent: true });

        // Gövde
        const body = new THREE.Mesh(new THREE.BoxGeometry(2.1, 0.6, 4.5), paint);
        body.position.y = 0.6;
        body.castShadow = true;
        mercedes.add(body);

        // Tavan / Kabin
        const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.5, 2.5), paint);
        cabin.position.set(0, 1.15, -0.3);
        mercedes.add(cabin);

        // Ön Izgara (Mercedes Logosu Temsili)
        const grill = new THREE.Mesh(new THREE.PlaneGeometry(1, 0.4), new THREE.MeshStandardMaterial({color: 0xcccccc, metalness: 1}));
        grill.position.set(0, 0.6, 2.26);
        mercedes.add(grill);

        // Tekerlekler
        const wheelGeo = new THREE.CylinderGeometry(0.42, 0.42, 0.35, 24);
        const wheelMat = new THREE.MeshStandardMaterial({ color: 0x050505 });
        const wheelPos = [[1, 1.4], [-1, 1.4], [1, -1.4], [-1, -1.4]];
        wheelPos.forEach(p => {
            const w = new THREE.Mesh(wheelGeo, wheelMat);
            w.rotation.z = Math.PI/2;
            w.position.set(p[0], 0.42, p[1]);
            mercedes.add(w);
        });

        scene.add(mercedes);

        // --- BOTLAR (NPC) ---
        let score = 0;
        const bots = [];
        const botGeo = new THREE.CylinderGeometry(0.4, 0.4, 1.7, 16);
        const botMat = new THREE.MeshStandardMaterial({ color: 0xff3300 });

        function createBot() {
            const b = new THREE.Mesh(botGeo, botMat);
            b.position.set(Math.random() * 60 - 30, 0.85, Math.random() * 100 - 50);
            scene.add(b);
            bots.push(b);
        }
        for(let i=0; i<25; i++) createBot();

        // --- KONTROL SİSTEMİ ---
        const keys = { f: 0, b: 0, l: 0, r: 0 };
        const setupBtn = (id, k) => {
            const el = document.getElementById(id);
            const press = (e) => { e.preventDefault(); keys[k] = 1; };
            const release = (e) => { e.preventDefault(); keys[k] = 0; };
            el.addEventListener('touchstart', press); el.addEventListener('touchend', release);
            el.addEventListener('mousedown', press); el.addEventListener('mouseup', release);
        };
        setupBtn('btnGas','f'); setupBtn('btnBrake','b'); setupBtn('btnLeft','l'); setupBtn('btnRight','r');

        let speed = 0, angle = 0;
        function update() {
            if(keys.f) speed += 0.015;
            else if(keys.b) speed -= 0.015;
            else speed *= 0.96;

            speed = Math.max(-0.2, Math.min(0.7, speed)); // Hız sınırı

            if(Math.abs(speed) > 0.02) {
                if(keys.l) angle += 0.04;
                if(keys.right || keys.r) angle -= 0.04; 
            }
            // Yukarıdaki satırda sağ buton ID hatasını düzeltmek için:
            if(keys.r) angle -= 0.04;

            mercedes.rotation.y = angle;
            mercedes.position.x += Math.sin(angle) * speed;
            mercedes.position.z += Math.cos(angle) * speed;

            // Çarpışma
            bots.forEach(b => {
                if(mercedes.position.distanceTo(b.position) < 1.8) {
                    b.position.set(Math.random()*100-50, 0.85, mercedes.position.z + (Math.random()*100-50));
                    score += 50;
                    document.getElementById('scoreVal').innerText = score;
                }
            });

            // KAMERA TAKİBİ (Dinamik ve Lüks Açı)
            const camDist = 9;
            const camHeight = 4;
            const targetPos = new THREE.Vector3(
                mercedes.position.x - Math.sin(angle) * camDist,
                mercedes.position.y + camHeight,
                mercedes.position.z - Math.cos(angle) * camDist
            );
            camera.position.lerp(targetPos, 0.1);
            camera.lookAt(mercedes.position.x, mercedes.position.y + 1, mercedes.position.z);

            renderer.render(scene, camera);
            requestAnimationFrame(update);
        }

        window.onresize = () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        };

        update();
    </script>
</body>
</html>
